[package]
name = "acp-spawn"
version = "0.1.1"
edition = "2024"

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
nix = { version = "0.30.1", features = ["process", "signal"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
signal-hook = "0.3.18"
time = { version = "0.3.44", features = ["formatting"] }
toml = "0.9.7"
