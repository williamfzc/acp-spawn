name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_os: linux
            artifact_arch: x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_os: linux
            artifact_arch: aarch64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_os: macos
            artifact_arch: aarch64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Add cross-compilation target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        uses: taiki-e/install-action@cross

      - name: Build Linux release
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify Linux binary is static
        if: startsWith(matrix.target, 'x86_64-unknown-linux') || startsWith(matrix.target, 'aarch64-unknown-linux')
        run: |
          file target/${{ matrix.target }}/release/acp-spawn | tee /tmp/acp-spawn-file.txt
          grep -q "statically linked" /tmp/acp-spawn-file.txt

      - name: Build macOS release
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          ARTIFACT_NAME=acp-spawn-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz
          cd target/${{ matrix.target }}/release
          tar czf ${ARTIFACT_NAME} acp-spawn
          shasum -a 256 ${ARTIFACT_NAME} > ${ARTIFACT_NAME}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/acp-spawn-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz
            target/${{ matrix.target }}/release/acp-spawn-${{ matrix.artifact_os }}-${{ matrix.artifact_arch }}.tar.gz.sha256
          generate_release_notes: true
