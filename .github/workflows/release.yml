name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package binary
        run: |
          cd target/release
          tar czf acp-spawn-linux-x86_64.tar.gz acp-spawn
          sha256sum acp-spawn-linux-x86_64.tar.gz > acp-spawn-linux-x86_64.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/acp-spawn-linux-x86_64.tar.gz
          generate_release_notes: true